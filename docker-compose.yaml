services:
  postgres:
    image: postgres:18.4
    container_name: photobook-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: photobook
      POSTGRES_PASSWORD: photobook
      POSTGRES_DB: photobook

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobook -d photobook"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
