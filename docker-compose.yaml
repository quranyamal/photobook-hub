services:
  postgres:
    image: postgres:18.4
    container_name: photobook-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: photobook
      POSTGRES_PASSWORD: photobook
      POSTGRES_DB: photobook

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobook -d photobook"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: photobook-jaeger
    restart: unless-stopped

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photobook-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql://photobook:photobook@postgres:5432/photobook"
      AUTH_SECRET: "${AUTH_SECRET}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      UPLOAD_DIR: "/app/.uploads"
      OTEL_SERVICE_NAME: "photobook-hub"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
      NODE_ENV: "production"

    ports:
      - "3000:3000"

    volumes:
      - uploads_data:/app/.uploads

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  uploads_data:
