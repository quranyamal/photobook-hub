<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" aria-label="PhotoBook Hub">
  <!-- Book cover -->
  <rect x="2" y="4" width="36" height="36" rx="6" ry="6" fill="#C9870B"/>
  <!-- Spine -->
  <rect x="11" y="4" width="3" height="36" fill="#A36408"/>
  <!-- Page lines -->
  <rect x="17" y="14" width="15" height="2.5" rx="1.25" fill="#FDF5E8"/>
  <rect x="17" y="20" width="11" height="2.5" rx="1.25" fill="#FDF5E8"/>
  <rect x="17" y="26" width="13" height="2.5" rx="1.25" fill="#FDF5E8"/>
  <!-- Photo dot -->
  <circle cx="28" cy="10" r="3.5" fill="#FDF5E8" opacity="0.85"/>
  <!-- "PhotoBook" wordmark -->
  <text x="48" y="27"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="18" font-weight="700" letter-spacing="-0.3" fill="#3A2E1E">PhotoBook</text>
  <!-- " Hub" in terracotta -->
  <text x="158" y="27"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="18" font-weight="400" letter-spacing="-0.2" fill="#9B4F2A"> Hub</text>
</svg>
